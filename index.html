  <title>Stat Brainteaser</title>
  <meta name="description" content="Offline trainer for quant, trading, data and ML interviews: probability, statistics, EV, Markov chains, Kelly betting, options, market making, game theory, number theory, Fermi, Python, SQL and ML — plus a mock interview mode, concept lessons, a curated library, a Python coding lab, an interview guide, an arcade, firm prep, interview study plans, superday mocks and QUMC / Putnam competition prep.">
  <meta name="theme-color" content="#f5f5f6">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StatBrain">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="arcade.css">
  <link rel="stylesheet" href="features.css">
  <script>
    /* Apply saved theme before first paint to avoid a flash. */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('statbt.progress.v1') || '{}');
        var t = s && s.settings && s.settings.theme;
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
    window.addEventListener('error', function (e) {
      try {
        document.documentElement.setAttribute('data-err', String(e.message || e));
        var b = document.getElementById('errBanner');
        if (b) { b.textContent = 'Something went wrong: ' + (e.message || e) + ' — try reloading.'; b.classList.remove('hidden'); }
      } catch (_) {}
    });
  </script>
</head>
